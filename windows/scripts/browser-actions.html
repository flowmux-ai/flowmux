<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>DOM 한글 한 é 😀</title><style>body{font:16px sans-serif}textarea{display:block}#spacer{height:1800px}</style></head><body>
<h1 id="heading">동작 한글 한 é 😀</h1>
<label for="entry">입력 한글</label><input id="entry"><textarea id="area" aria-label="본문 한글"></textarea>
<input id="readonly" value="원문" readonly aria-label="읽기 전용"><fieldset disabled><input id="disabled" value="원문" aria-label="비활성"></fieldset>
<input id="file" type="file" aria-label="파일"><input id="cancel" value="원문" aria-label="취소">
<input id="replace" value="원문" aria-label="교체"><input id="lock" value="원문" aria-label="잠금"><input id="busy" value="원문" aria-label="대기 입력">
<input id="checked" type="checkbox" aria-label="확인">
<input id="radio1" type="radio" name="group" checked aria-label="첫 라디오"><input id="radio2" type="radio" name="group" aria-label="둘째 라디오">
<select id="pick" aria-label="선택"><option value="">기본</option><option value="text-match">우선</option><option value="우선">값 우선</option><option value="한 😀">한글 항목</option><option value="accent"> é 😀 </option><optgroup disabled label="불가"><option value="blocked">차단</option></optgroup></select>
<select id="multiple" multiple aria-label="다중 선택"><option value="first" selected>첫째</option><option value="한 😀">둘째</option></select>
<button id="click" type="button">클릭</button><button id="double" type="button">더블</button><button id="hover" type="button">호버</button>
<button id="replace-click" type="button">교체 클릭</button><a id="link" href="/dom?clicked=1">이동</a>
<div id="spacer"></div><button id="scroll" type="button">스크롤 목적지</button>
<script>
window.events=[];window.clicks=0;window.doubleClicks=0;window.setterCalls=0;
const getter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').get;
const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
Object.defineProperty(document.querySelector('#entry'),'value',{get(){return getter.call(this);},set(value){setterCalls++;setter.call(this,value);}});
for(const type of ['beforeinput','input','change','click','dblclick','mouseenter','mouseover','focusin','focusout','keydown','keyup','compositionstart','compositionend']) {
 document.addEventListener(type,event=>events.push({id:event.target.id,type:event.type,trusted:event.isTrusted,data:event.data??null,inputType:event.inputType??null,value:event.target.value??null}),true);
}
document.querySelector('#click').addEventListener('click',()=>clicks++);
document.querySelector('#double').addEventListener('dblclick',()=>doubleClicks++);
document.querySelector('#cancel').addEventListener('beforeinput',event=>event.preventDefault());
document.querySelector('#replace').addEventListener('beforeinput',event=>{const clone=event.target.cloneNode(true);clone.value='새 대상';event.target.replaceWith(clone);});
document.querySelector('#lock').addEventListener('beforeinput',event=>event.target.disabled=true);
document.querySelector('#busy').addEventListener('beforeinput',()=>{const end=Date.now()+600;while(Date.now()<end){}});
document.querySelector('#replace-click').addEventListener('click',event=>{clicks++;event.target.replaceWith(event.target.cloneNode(true));});
</script></body></html>
