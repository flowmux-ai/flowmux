# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "flowmux-windows"
version = "0.10.1"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

# Deliberately separate: Windows dependencies never enter the existing GTK
# workspace or its lockfile. Shared domain models are read-only dependencies.
[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
flowmux-core = { path = "../crates/flowmux-core" }
flowmux-config = { path = "../crates/flowmux-config" }
flowmux-browser = { path = "../crates/flowmux-browser" }
flowmux-editor = { path = "../crates/flowmux-editor" }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "=2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }
raw-window-handle = "=0.6.2"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console",
    "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_System_SystemServices",
    "Win32_Security_Authorization", "Win32_System_Memory",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "flowmux"
path = "src/main.rs"

[[bin]]
name = "flowmuxctl"
path = "src/bin/flowmuxctl.rs"

[[bin]]
name = "flowmux-command"
path = "src/bin/flowmux-command.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
