<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/terminal.css">
<title>flowmux terminal</title></head><body>
<div id="terminal" aria-label="Terminal"></div>
<div id="minimap" role="scrollbar" aria-label="Terminal scrollback minimap" aria-controls="terminal" aria-orientation="vertical" tabindex="0" title="Wheel previews history; click or drag scrolls the terminal" hidden><canvas aria-hidden="true"></canvas><div class="viewport" aria-hidden="true"></div></div>
<div id="terminal-menu" role="menu" aria-label="Terminal actions" hidden>
<button type="button" role="menuitem" data-action="copy">Copy</button>
<button type="button" role="menuitem" data-action="paste">Paste</button>
<div role="separator"></div>
<button type="button" role="menuitem" data-action="split_right" disabled>Split Right</button>
<button type="button" role="menuitem" data-action="split_down" disabled>Split Down</button>
<div role="separator"></div>
<button type="button" role="menuitem" data-action="copy_path">Copy path</button>
<div role="separator"></div>
<button type="button" role="menuitem" data-action="close_pane" disabled>Close Pane</button>
</div>
<form id="search" hidden aria-label="Find in terminal">
<div class="search-row"><label>Find <input id="query" autocomplete="off" spellcheck="false" maxlength="1024" aria-label="Search terminal" aria-describedby="search-status"></label>
<label title="Match case"><input id="match-case" type="checkbox" aria-label="Match case">Aa</label>
<label title="Regular expression"><input id="regex" type="checkbox" aria-label="Regular expression">.*</label>
<button id="find-previous" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
<button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">↓</button>
<button id="find-close" type="button" title="Close search (Esc)" aria-label="Close search">×</button></div>
<div id="search-status" role="status" aria-live="polite"></div>
</form>
<div id="input-status" role="status" aria-live="polite"></div>
<div id="status" role="status"></div><script src="/terminal.js"></script>
</body></html>
