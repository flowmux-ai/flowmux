[package]
name = "flowmux-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Headless flowmux daemon: IPC server + state without GTK. Useful for CI and for environments where the GUI isn't installed."

[[bin]]
name = "flowmux-daemon"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
flowmux-core = { workspace = true }
flowmux-config = { workspace = true }
flowmux-state = { workspace = true }
flowmux-vcs = { workspace = true }
flowmux-procmon = { workspace = true }
flowmux-notify = { workspace = true }
flowmux-ipc = { workspace = true }
flowmux-terminal = { workspace = true }

# Preserve terminal state without a GUI, including reflow and wide cells.
alacritty_terminal = { version = "0.26", default-features = false }
libc = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
tempfile = "3"
