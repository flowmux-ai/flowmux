[package]
name = "flowmux-md-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Markdown viewer for flowmux."

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
comrak = { version = "0.52", default-features = false, features = ["shortcodes"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKSnapshotConfiguration", "WKUserContentController", "WKUserScript", "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebpagePreferences", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[[test]]
name = "macos_native"
harness = false

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
