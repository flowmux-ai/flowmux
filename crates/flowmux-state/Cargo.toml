[package]
name = "flowmux-state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Persistence for flowmux: workspace/surface/pane state under $XDG_STATE_HOME."

[dependencies]
flowmux-core = { workspace = true }
flowmux-config = { workspace = true }
flowmux-procmon = { workspace = true }
flowmux-vcs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
# Keep checked u64 revisions and usize query limits supported.
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
url = "2"

[dev-dependencies]
tempfile = "3"
