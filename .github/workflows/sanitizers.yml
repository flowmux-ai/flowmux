# SPDX-License-Identifier: GPL-3.0-or-later
name: Sanitizers

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - 'docs/legal/**'
      - '!resources/screenshot/**'
  workflow_dispatch:

jobs:
  address:
    name: Linux ASan and LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust sanitizer toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rust-src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install native dependencies
        run: |
          # Match Test CI's fallback for slow Azure downloads.
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|s/priority:1/priority:4/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev libssl-dev \
            libssh2-1-dev libdbus-1-dev meson ninja-build dbus-x11 xvfb tmux llvm-18 apparmor
          sudo ./scripts/install-thorvg.sh
      - name: Allow WebKit namespaces for the test process
        run: |
          sudo install -m644 packaging/apparmor/flowmux-webkit /etc/apparmor.d/flowmux-webkit
          sudo sh packaging/debian/postinst configure
      - name: Headless ASan and leak checks
        run: bash scripts/test-sanitizers.sh headless
      - name: Native Lottie ASan and leak checks
        run: bash scripts/test-sanitizers.sh lottie -- --test-threads=1
      - name: GUI ASan checks
        run: aa-exec -p flowmux-webkit -- bash scripts/test-sanitizers.sh gui -- --test-threads=1

  thorvg:
    name: ThorVG ASan, UBSan and LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 meson ninja-build pkg-config
      - name: Check Lottie expressions and native ownership
        run: bash scripts/test-thorvg-sanitizers.sh
