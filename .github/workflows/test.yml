name: Test
on:
  workflow_dispatch:
jobs:
  macos:
    name: Native keyboard diagnostic
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      GSK_RENDERER: cairo
      G_DEBUG: fatal-criticals
      FLOWMUX_EDITOR_FOCUS_SMOKE_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-key-debug-${{ github.sha }}
          restore-keys: native-key-debug-
      - run: brew install pkg-config gtk4 libadwaita vte3
      - run: cargo test -p flowmux --test macos_native --features native-smoke --locked --no-run
      - uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-key-debug-${{ github.sha }}
      - name: Repeat native keyboard scenario
        run: |
          status=0
          for attempt in $(seq 1 2); do
            if cargo test -p flowmux --test macos_native --features native-smoke --locked > "target/native-keyboard-$attempt.log" 2>&1; then
              cat "target/native-keyboard-$attempt.log"
            else
              cat "target/native-keyboard-$attempt.log"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-keyboard-diagnostic
          path: target/native-keyboard-*.log
