name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

jobs:
  editor-web:
    name: editor web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/flowmux-editor-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/flowmux-editor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and rebuild editor assets
        run: |
          npm run test:coverage
          npm run build
          npm run verify

      - name: Check committed editor assets
        working-directory: .
        run: git diff --exit-code -- editor/flowmux-editor-web/dist

  cargo-test:
    name: cargo test and coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.6.24 --locked

      - name: Install Node.js for the OpenCode hook integration test
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            libwebkitgtk-6.0-dev libssl-dev \
            libssh2-1-dev libdbus-1-dev \
            meson ninja-build \
            dbus-x11 xvfb openssh-server tmux python3-xlib apparmor \
            python3-gi gir1.2-atspi-2.0 python3-pil

      - name: Install ThorVG (image viewer backend, all loaders + C API)
        run: sudo ./scripts/install-thorvg.sh

      - name: Allow WebKit namespaces for the test process
        run: |
          sudo install -m644 packaging/apparmor/flowmux-webkit /etc/apparmor.d/flowmux-webkit
          sudo sh packaging/debian/postinst configure
          sudo sh packaging/debian/prerm upgrade
          aa-exec -p flowmux-webkit -- true
          sudo sh packaging/debian/prerm remove
          if aa-exec -p flowmux-webkit -- true 2>/dev/null; then
            echo 'profile must be unloaded on package removal' >&2
            exit 1
          fi
          sudo sh packaging/debian/postinst configure

      - name: Run the shared Linux gate
        timeout-minutes: 30
        run: aa-exec -p flowmux-webkit -- bash scripts/test-ci.sh linux

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence
          path: |
            target/ci/linux
            target/llvm-cov
          if-no-files-found: warn

  stress:
    name: headless stress probes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Run the separately ignored stress probes
        run: cargo test -p flowmux-core -p flowmux-daemon -p flowmux-notify --locked -- --ignored --nocapture

  macos:
    name: macOS build and native smoke
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Install native dependencies
        run: brew install pkg-config gtk4 libadwaita vte3
      - name: Run the shared macOS gate
        run: bash scripts/test-ci.sh macos
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-evidence
          path: target/ci/macos
          if-no-files-found: warn
