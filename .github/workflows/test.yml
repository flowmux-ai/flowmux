name: Test

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - 'docs/legal/**'
      - '!resources/screenshot/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: all
        options: [all, linux, macos]
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CI_TEST_SUITE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'regression' }}

jobs:
  editor-web:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: editor web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/flowmux-editor-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/flowmux-editor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and rebuild editor assets
        run: |
          npm test
          npm run build
          npm run verify

      - name: Check committed editor assets
        working-directory: .
        run: git diff --exit-code -- editor/flowmux-editor-web/dist

  # The Linux gate runs as independent groups on separate instances. linux-build
  # compiles the binaries once for the GUI groups; cargo-test collects the results.
  linux-build:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Rust toolchain
        run: rustup show active-toolchain

      - name: Install test dependencies
        uses: ./.github/actions/linux-test-deps

      - name: Build the workspace (same script as local)
        run: bash scripts/test-ci.sh linux "$CI_TEST_SUITE" build

      # A tar archive keeps the executable bits that artifact uploads drop.
      - name: Package binaries for the GUI groups
        run: tar -cf "$RUNNER_TEMP/flowmux-binaries.tar" -C target/debug flowmux flowmuxctl flowmux-daemon flowmux-md-viewer

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: ${{ runner.temp }}/flowmux-binaries.tar
          retention-days: 1

  # The script self-tests need only Python and rustfmt.
  linux-scripts:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: Linux script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Rust toolchain
        run: rustup show active-toolchain

      - name: Run script tests and formatting (same script as local)
        run: bash scripts/test-ci.sh linux "$CI_TEST_SUITE" scripts

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence-scripts
          path: target/ci/linux
          if-no-files-found: warn

  linux-workspace:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: Linux workspace tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Rust toolchain
        run: rustup show active-toolchain

      - name: Install Node.js for the OpenCode hook integration test
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test dependencies
        uses: ./.github/actions/linux-test-deps

      - name: Check the packaged WebKit profile lifecycle
        run: |
          sudo sh packaging/debian/prerm upgrade
          aa-exec -p flowmux-webkit -- true
          sudo sh packaging/debian/prerm remove
          if aa-exec -p flowmux-webkit -- true 2>/dev/null; then
            echo 'profile must be unloaded on package removal' >&2
            exit 1
          fi
          sudo sh packaging/debian/postinst configure

      - name: Run workspace tests (same script as local)
        timeout-minutes: 45
        run: aa-exec -p flowmux-webkit -- bash scripts/test-ci.sh linux "$CI_TEST_SUITE" workspace

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence-workspace
          path: target/ci/linux
          if-no-files-found: warn

  linux-gui:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    needs: linux-build
    name: Linux GUI tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [team-usage, team, agent-host, agent-session, browser, terminal]
    env:
      CI_TEST_PREBUILT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install test dependencies
        uses: ./.github/actions/linux-test-deps

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: ${{ runner.temp }}

      - name: Unpack binaries
        run: |
          mkdir -p target/debug
          tar -xf "$RUNNER_TEMP/flowmux-binaries.tar" -C target/debug

      - name: Run Linux GUI tests (same script as local)
        timeout-minutes: 45
        run: aa-exec -p flowmux-webkit -- bash scripts/test-ci.sh linux "$CI_TEST_SUITE" "${{ matrix.group }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence-${{ matrix.group }}
          path: |
            target/ci/linux
            /tmp/fm-gui-*/memory.jsonl
            /tmp/fm-gui-*/summary.json
            /tmp/fm-gui-*/idle-stability.log
            /tmp/fm-gui-*/polling-delay.log
            /tmp/fm-gui-*/editor-renderer.log
            /tmp/fm-gui-*/editor-io.log
            /tmp/fm-gui-*/session-flow.log
            /tmp/fm-gui-*/session-resume*.log
            /tmp/fm-gui-*/host.log
            /tmp/fm-gui-*/host-budget-*.json
            /tmp/fm-gui-*/native-host-hooks*.log
            /tmp/fm-gui-*/headless-screen-result-*.log
            /tmp/fm-gui-*/native-hooks-failure.json
            /tmp/fm-gui-*/session-resume-startup.json
            /tmp/fm-gui-*/session-resume-startup.png
            /tmp/fm-gui-*/session-resume-failure.json
            /tmp/fm-gui-*/session-resume-failure.png
            /tmp/fm-gui-*/agent-drag.log
            /tmp/fm-gui-*/image-links.log
            /tmp/fm-gui-*/events.jsonl
            /tmp/fm-gui-*/recovery-entered
            /tmp/fm-gui-*/entered
            /tmp/fm-gui-*/office-before-idle.png
            /tmp/fm-gui-*/office-after-idle.png
          if-no-files-found: warn

  cargo-test:
    # Report failed groups too, but not a run that was cancelled.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform != 'macos') }}
    needs: [linux-build, linux-scripts, linux-workspace, linux-gui]
    name: Linux regression tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux group to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "linux-build linux-scripts linux-workspace linux-gui: $RESULTS"
          for result in $RESULTS; do
            [[ $result == success ]] || exit 1
          done

      - name: Collect test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: linux-test-evidence
          pattern: linux-test-evidence-*
          separate-directories: true
          delete-merged: true

  stress:
    name: headless stress probes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.platform != 'macos')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Run the separately ignored stress probes
        run: cargo test -p flowmux-core -p flowmux-daemon -p flowmux-notify --locked -- --ignored --nocapture

  # The macOS gate runs as independent groups too; macos collects the results.
  macos-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    name: macOS tests (${{ matrix.group }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [scripts, headless, app, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Rust toolchain
        run: rustup show active-toolchain
      # The script self-tests need only Python and rustfmt.
      - name: Install test dependencies
        if: matrix.group != 'scripts'
        uses: ./.github/actions/macos-test-deps
      - name: Run macOS tests (same script as local)
        run: bash scripts/test-ci.sh macos "$CI_TEST_SUITE" "${{ matrix.group }}"
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-evidence-${{ matrix.group }}
          path: |
            target/ci/macos
            /tmp/fm-crash-*/gui-*.log
            /tmp/fm-crash-*/starts
            /tmp/fm-crash-*/progress
            /tmp/fm-crash-*/state/flowmux/state.json
          if-no-files-found: warn

  macos:
    # Report failed groups too, but not a run that was cancelled.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform != 'linux') }}
    needs: macos-tests
    name: macOS build and native smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Require every macOS group to pass
        env:
          RESULT: ${{ needs.macos-tests.result }}
        run: |
          echo "macos-tests: $RESULT"
          [[ $RESULT == success ]]

      - name: Collect test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: macos-test-evidence
          pattern: macos-test-evidence-*
          separate-directories: true
          delete-merged: true
