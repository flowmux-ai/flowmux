# SPDX-License-Identifier: GPL-3.0-or-later

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  license-audit:
    name: License audit
    uses: ./.github/workflows/license-audit.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: Build linux-x86_64
    needs: license-audit
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            libwebkitgtk-6.0-dev libssl-dev \
            libssh2-1-dev libdbus-1-dev libsecret-1-dev \
            meson ninja-build \
            dbus xvfb apparmor

      - name: Install ThorVG (image viewer backend, all loaders + C API)
        run: sudo ./scripts/install-thorvg.sh

      - name: Allow WebKit namespaces for the test process
        run: |
          sudo install -m644 packaging/apparmor/flowmux-webkit /etc/apparmor.d/flowmux-webkit
          sudo sh packaging/debian/postinst configure

      - name: Run test suite
        run: GDK_BACKEND=x11 GTK_A11Y=test G_DEBUG=fatal-criticals aa-exec -p flowmux-webkit -- xvfb-run -a dbus-run-session -- cargo test --workspace --locked -- --nocapture

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binaries
        run: |
          cargo build --release --locked \
            -p flowmux -p flowmux-md-viewer -p flowmux-cli -p flowmux-daemon

      - name: Stage tarball
        run: |
          set -euxo pipefail
          stage_name="flowmux-${{ steps.ver.outputs.version }}-${TARGET_TRIPLE}"
          stage="dist/${stage_name}"
          mkdir -p "$stage"
          cp target/release/flowmux            "$stage/"
          cp target/release/flowmux-md-viewer  "$stage/"
          cp target/release/flowmuxctl         "$stage/"
          cp target/release/flowmux-daemon     "$stage/"
          cp LICENSE NOTICE README.md \
            docs/legal/THIRD_PARTY_LICENSES.md "$stage/"
          cp packaging/apparmor/flowmux-webkit "$stage/flowmux-webkit.apparmor"
          tar -C dist -czf "dist/${stage_name}.tar.gz" "$stage_name"
          (cd dist && sha256sum "${stage_name}.tar.gz" > "${stage_name}.tar.gz.sha256")

      - name: Build .deb package
        run: |
          set -euxo pipefail
          cargo deb -p flowmux --no-build \
            --output "dist/flowmux_${{ steps.ver.outputs.version }}_amd64.deb"
          (cd dist && sha256sum "flowmux_${{ steps.ver.outputs.version }}_amd64.deb" \
            > "flowmux_${{ steps.ver.outputs.version }}_amd64.deb.sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flowmux-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  build-macos:
    name: Build macos-aarch64
    needs: license-audit
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TARGET_TRIPLE: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check toolchain and release version
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          rustup show active-toolchain
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET_TRIPLE"
          python3 <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["workspace"]["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the workspace version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-macos-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-macos-${{ runner.arch }}-

      - name: Install native dependencies
        run: brew install pkg-config gtk4 libadwaita vte3

      - name: Run macOS tests and native smoke
        run: bash scripts/test-ci.sh macos

      - name: Build release app bundle without installing
        run: bash install.sh --release --bundle-only

      # shortcut: runtime libraries stay in Homebrew; bundle them for standalone distribution.
      - name: Package and verify macOS archive
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/flowmux-macos"
          mkdir -p "$stage" dist
          ditto target/macos-bundle/Flowmux.app "$stage/Flowmux.app"
          cp packaging/macos/README.md "$stage/README.md"
          archive="flowmux-${VERSION}-${TARGET_TRIPLE}.zip"
          ditto -c -k --sequesterRsrc "$stage" "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          (cd dist && shasum -a 256 -c "$archive.sha256")
          extracted="$RUNNER_TEMP/flowmux-macos-extracted"
          ditto -x -k "dist/$archive" "$extracted"
          app="$extracted/Flowmux.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          for binary in flowmux flowmuxctl; do
            test "$(lipo -archs "$app/Contents/MacOS/$binary")" = arm64
            test "$("$app/Contents/MacOS/$binary" --version)" = "flowmux $VERSION"
          done
          test -s "$app/Contents/Resources/THIRD_PARTY_LICENSES.md"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flowmux-macos-aarch64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-test-evidence
          path: target/ci/macos
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      # Full history + tags are required so the release-notes step can diff
      # this tag against the previous v* tag and produce a categorized
      # commit list. fetch-depth: 0 pulls the whole graph, and fetch-tags
      # ensures local tag refs are present even when this run was triggered
      # via workflow_dispatch.
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: flowmux-*
          merge-multiple: true

      - name: Resolve tag
        id: ver
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve previous tag
        id: prev
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          # Select the highest other v* tag using Git's version sort. This
          # does not restrict selection to tags older than the requested release.
          prev=$(git tag --list 'v*' --sort=-version:refname \
            | grep -vFx "$tag" \
            | head -n1 || true)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "Previous tag: $prev"
          else
            echo "No previous tag — treating as initial release."
          fi

      - name: Build release notes
        id: notes
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY' > RELEASE_NOTES.md
          import os, re, subprocess

          prev = os.environ.get("PREV_TAG", "")
          tag  = os.environ["TAG"]
          repo = os.environ["REPO"]

          # Compare against the selected tag, or use all reachable history if none exists.
          rev_range = f"{prev}..{tag}" if prev else tag
          log = subprocess.check_output(
              ["git", "log", "--no-merges", "--pretty=format:%h%x09%s", rev_range],
              text=True,
          ).strip()

          # Classify commit subjects by Conventional Commits prefix.
          categories = [
              ("Features",      re.compile(r"^feat(\([^)]+\))?!?:\s*", re.I)),
              ("Bug fixes",     re.compile(r"^fix(\([^)]+\))?!?:\s*",  re.I)),
              ("Performance",   re.compile(r"^perf(\([^)]+\))?!?:\s*", re.I)),
              ("Refactoring",   re.compile(r"^refactor(\([^)]+\))?!?:\s*", re.I)),
              ("Documentation", re.compile(r"^docs(\([^)]+\))?!?:\s*", re.I)),
              ("CI / Build",    re.compile(r"^(ci|build|chore)(\([^)]+\))?!?:\s*", re.I)),
              ("Tests",         re.compile(r"^test(\([^)]+\))?!?:\s*", re.I)),
          ]
          buckets = {name: [] for name, _ in categories}
          others  = []

          for line in log.splitlines():
              if not line:
                  continue
              sha, subject = line.split("\t", 1)
              for name, pat in categories:
                  if pat.match(subject):
                      buckets[name].append((sha, subject))
                      break
              else:
                  others.append((sha, subject))

          out = []

          # Highlights: top feat: subjects (capped) with the type prefix
          # stripped so they read as plain user-facing summaries.
          highlight_strip = re.compile(r"^[a-z]+(\([^)]+\))?!?:\s*", re.I)
          features = buckets["Features"]
          if features:
              out.append("## Highlights")
              for sha, subject in features[:5]:
                  out.append(f"- {highlight_strip.sub('', subject)}")
              out.append("")

          out.append("## What's Changed")
          out.append("")
          for name, _ in categories:
              items = buckets[name]
              if not items:
                  continue
              out.append(f"### {name}")
              for sha, subject in items:
                  out.append(f"- {subject} ({sha})")
              out.append("")
          if others:
              out.append("### Other")
              for sha, subject in others:
                  out.append(f"- {subject} ({sha})")
              out.append("")

          if prev:
              out.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...{tag}")
          else:
              out.append("_Initial release — full history included above._")

          out.append("")
          out.append(
              f"**Corresponding source**: "
              f"https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz"
          )

          out.append("")
          out.append("## macOS preview")
          out.append("")
          out.append(
              "The Apple Silicon ZIP requires Homebrew `gtk4`, `libadwaita`, "
              "and `vte3` under `/opt/homebrew`; it is not a standalone app. "
              "It is ad-hoc signed, not Developer ID signed or notarized, "
              "so Gatekeeper may block it. See the README inside the ZIP "
              "for installation and update limitations."
          )

          print("\n".join(out).rstrip() + "\n")
          PY

          echo "===== RELEASE_NOTES.md ====="
          cat RELEASE_NOTES.md
          echo "============================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          # Publish the categorized commit log generated above.
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.zip
            dist/*.zip.sha256
