name: License audit

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to audit
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/license-audit.yml
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - 'crates/**/Cargo.toml'
      - deny.toml
      - about.toml
      - about.hbs
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES.md
      - THIRD_PARTY_ASSET_NOTICES.md
      - 'crates/flowmux-config/themes/**'
      - 'crates/flowmux-md-viewer/tests/fixtures/**'
      - crates/flowmux-editor/src/web_assets.rs
      - 'resources/themes/**'
      - packaging/flatpak/com.flowmux.App.yml
      - scripts/generate-third-party-licenses.sh
      - scripts/install-macos.sh
      - scripts/install-thorvg.sh
      - editor/flowmux-editor-web/package.json
      - editor/flowmux-editor-web/package-lock.json
      - editor/flowmux-editor-web/MONACO_THIRD_PARTY_NOTICES.txt
      - editor/flowmux-editor-web/THIRD_PARTY_NOTICES.md
      - 'editor/flowmux-editor-web/dist/*NOTICE*'
      - editor/flowmux-editor-web/dist/main.js
      - 'editor/flowmux-editor-web/scripts/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Check dependency licenses and sources
        run: cargo deny --locked check licenses sources

      - name: Check third-party license notice
        run: |
          scripts/generate-third-party-licenses.sh
          git diff --exit-code THIRD_PARTY_LICENSES.md

      - name: Install editor dependencies
        working-directory: editor/flowmux-editor-web
        run: npm ci --ignore-scripts

      - name: Check editor dependency notice
        working-directory: editor/flowmux-editor-web
        run: npm run verify
