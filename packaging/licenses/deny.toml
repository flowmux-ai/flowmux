# SPDX-License-Identifier: GPL-3.0-or-later

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Maintenance advisory only. Remove this exception when persisted and IPC timestamps have migrated off chrono." },
    { id = "RUSTSEC-2026-0594", reason = "The macOS webdriver dependency does not enable encrypted cookies. The feature check below guards this while webdriver requires cookie 0.16." },
]

[[bans.features]]
crate = "cookie:<0.18.3"
deny = ["private"]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MITNFA",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
